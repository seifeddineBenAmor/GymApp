services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gymapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gymapp}
      POSTGRES_DB: ${POSTGRES_DB:-gymapp}
    volumes:  
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gymapp}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    env_file: ./backend/.env
    volumes:
      - ./backend:/app                 # hot reload
      - ./backend/uploads:/app/uploads # persist uploads
      - ./backend/videos:/app/videos   # persist videos
    ports:
      - "9000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules              # keep container node_modules isolated
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:
